version: '3.8'
# NOTE: The secrets below are for LOCAL DEVELOPMENT ONLY.
# In production, use docker secrets or a .env file that is NOT committed to version control.
services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/mysql-client
      - JWT_SECRET=dev-secret-key-change-in-production
      - ENCRYPTION_KEY=dev-encryption-key-32chars!!!!!
      - PORT=3001
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
